name: Reusable Rust Gem Release

# =============================================================================
# REUSABLE RELEASE WORKFLOW for scientist-labs Rust-backed Ruby gems.
#
# THIS IS A REUSABLE WORKFLOW (on: workflow_call), NOT a composite/JS/Docker
# action: the four build legs are SEPARATE JOBS across two runner OSes
# (ubuntu-24.04 + macos-26) with strategy.matrix, needs edges, and per-job
# permissions — none of which a composite action can express.
#
# Extracted from red-candle's proven-green release.yml (red-candle 1.8.0 shipped
# all four platforms to rubygems.org, 2026-06-18). Builds, for a pushed version
# tag:
#   - the source "ruby" gem            (universal fallthrough; needs Rust on install)
#   - <gem>-<v>-x86_64-linux.gem       (precompiled, glibc)
#   - <gem>-<v>-aarch64-linux.gem      (precompiled, glibc; CROSS-compiled on x86_64)
#   - <gem>-<v>-arm64-darwin.gem       (precompiled; built NATIVELY on Apple Silicon)
# Each fat gem carries one compiled extension per Ruby ABI in ruby-versions, so
# consumers install with no Rust toolchain.
#
# THREE EVENT PATHS (branched in prepare, which emits is-release / ref-name / sha
# that the build legs key off — they no longer test github.event_name directly):
#   - push (a version TAG): the REAL release. prepare guards tag == version-command,
#     every leg builds, the source gem creates the GitHub Release, and (with
#     publish:true + a key) all gems push to RubyGems. (is-release=true, ref-name=tag,
#     sha=github.sha — byte-identical to prior versions.)
#   - workflow_dispatch WITH a `version` input: the "type a version in a box" release.
#     prepare writes `version` via bump-command, commits, cuts+pushes the bare tag, and
#     releases it in THIS run (is-release=true, ref-name=version, sha=bumped commit).
#     The GITHUB_TOKEN-pushed tag does NOT re-trigger the caller's tag workflow, so
#     there is no double release and no PAT is needed. RubyGems push still obeys publish.
#   - workflow_dispatch WITHOUT a version (caller's `publish` boolean, default false):
#     an ephemeral full-matrix DRY-RUN off a BRANCH. prepare takes the version straight
#     from version-command (NO tag guard — GITHUB_REF_NAME is the branch), every leg
#     BUILDS (validate gem build + cross-gem + fat-gem assembly), but is-release=false
#     so the GitHub Release + every "Attach to Release" step are skipped (no junk Release
#     named after the branch) and nothing pushes. Byte-identical to prior versions.
#     See README "Publishing".
#
# -----------------------------------------------------------------------------
# INPUTS (see each input's `description:` below for the full contract)
#   gem-name            (REQUIRED) RubyGems package name; drives every push/attach glob.
#   ext-name            Compiled extension / lib subdir name. Empty -> resolves to gem-name.
#   gemspec             Gemspec FILE to `gem build`. Empty -> '<resolved-ext-name>.gemspec'.
#   version-command     Shell command that prints the bare version; tag must equal it.
#                       Default is red-candle's; EVERY other consumer MUST override.
#   ruby-versions       CSV of Ruby ABIs compiled into every fat gem.
#   compile-command     Native macOS compile entrypoint (darwin legs only).
#   platform-gem-env    Env var name the gemspec reads to enter its precompiled branch.
#   darwin-platform     Darwin platform string for the fat gem (default arm64-darwin).
#   x86_64-cargo-config OPTIONAL .cargo/config.toml text, written on the x86_64-linux leg ONLY.
#   linux-cargo-config  OPTIONAL .cargo/config.toml text, written on BOTH linux legs (base).
#   aarch64-cargo-config OPTIONAL .cargo/config.toml text, written on the aarch64-linux leg ONLY.
#   darwin-pre-build-command OPTIONAL shell run on each darwin leg BEFORE compile (e.g. brew install).
#   linux-image-setup   OPTIONAL shell snippet RUN into the rb-sys cross image (built inline,
#                       FROM rbsys/<platform>:<tag>) before each enabled linux leg. Empty ->
#                       no-op. The LINUX system-dep hook (apt / download tool / multiarch).
#   linux-rbsys-tag     rb_sys :tag the inline image is tagged as (default 0.9.128); must == each
#                       gem's resolved rb_sys version. Only used when linux-image-setup is set.
#   job-timeout-minutes OPTIONAL per-job timeout for the heavy build legs (default 360).
#   darwin-verify-cmd   OPTIONAL extra shell run per darwin leg, with $BUNDLE exported.
#   publish             Intent gate for `gem push` (default FALSE). A caller threads
#                       this from a workflow_dispatch boolean to drive dry-runs.
#   version             OPTIONAL. On a workflow_dispatch run, the version to bump+tag+
#                       release in this same run (the "type a version in a box" path).
#                       Empty/ on push -> ignored. Requires bump-command.
#   bump-command        Shell command that writes `version` into the gem's version file
#                       ($VERSION exported). Required only to use the `version` input.
#   build-darwin / build-x86_64-linux / build-aarch64-linux  per-leg toggles.
#   NOTE: the linux cargo-config inputs CANNOT apt-install — cross-gem@v1.4.4 runs the
#   build in a fixed rb-sys-dock image with no in-container hook. An [env] only helps if
#   the tool already exists in the image (clang/llvm/cmake/cross-sysroot yes; protoc/
#   gfortran no). A gem needing an absent linux package either toggles that leg off OR
#   adds it via linux-image-setup (inline-built into the cross image; see that input).
#
# SECRETS
#   rubygems-api-key    OPTIONAL. Mapped into GEM_HOST_API_KEY by every push step.
#                       Omitted -> empty -> push is a clean no-op (never used in any `if:`).
#
# OUTPUTS
#   version, prerelease, ext-name, gemspec, release-url, published, platforms-built.
#
# -----------------------------------------------------------------------------
# CONSUMER PREREQUISITES (the shared workflow CANNOT do these for you):
#
#   1. ABI REQUIRE-SHIM in lib/<gem>.rb — try the versioned native path first,
#      fall back to flat, resolving through $LOAD_PATH (`require`, NOT
#      `require_relative`, because RubyGems installs native extensions outside
#      lib/). The require path uses <ext-name>, not <gem-name>:
#        begin
#          RUBY_VERSION =~ /(\d+\.\d+)/
#          require "<ext>/#{Regexp.last_match(1)}/<ext>"
#        rescue LoadError
#          require "<ext>/<ext>"
#        end
#
#   2. GEMSPEC ENV-GATED PLATFORM BRANCH — the gemspec must read the env var named
#      by `platform-gem-env` (default RUST_GEM_PLATFORM) and, when set:
#        spec.platform   = ENV["RUST_GEM_PLATFORM"]
#        spec.extensions = []                       # no recompile-on-install
#        spec.files     += Dir["lib/<ext>/*/<ext>.bundle"] + Dir["lib/<ext>/*/<ext>.so"]
#      else declare `spec.extensions = ["ext/<ext>/extconf.rb"]`.
#      Until BOTH the shim and this branch exist, the precompiled gems publish but
#      simply won't load — only the SOURCE gem is usable.
#
#   3. CALLER WORKFLOW owns the tag trigger and the token grant. A reusable
#      (workflow_call) workflow has NO on.push.tags. The caller supplies:
#        on: { push: { tags: [ "[0-9]+.[0-9]+.[0-9]+", ... ] } }
#        permissions: { contents: write }           # a reusable workflow can only
#                                                    # REDUCE inherited token scope
#        jobs.release.uses: scientist-labs/rust-gem-release/.github/workflows/release.yml@0.10.0
#      The repo's default workflow token must NOT be read-only or `gh release
#      create` 403s. See examples/red-candle-release.yml.
#
# Third-party AND first-party actions are SHA-pinned (supply-chain). Comments show
# the tag. Pins are centralized here so consumers inherit them.
# =============================================================================

on:
  workflow_call:
    inputs:
      gem-name:
        description: "RubyGems package NAME (REQUIRED). Drives every push/attach/asset glob. MUST stay distinct from gemspec basename and ext-name when they differ (red-candle: gem-name=red-candle, ext-name=candle)."
        type: string
        required: true
      ext-name:
        description: "Compiled extension / lib subdir name. Artifact lands at lib/<ext-name>/<ext-name>.bundle and lib/<ext-name>/<minor>/<ext-name>.bundle. EMPTY DEFAULT -> prepare resolves to gem-name. Only aliasing gems set it (red-candle=candle, indradb-ruby=indradb)."
        type: string
        required: false
        default: ""
      gemspec:
        description: "Gemspec FILE passed to `gem build`. EMPTY DEFAULT -> prepare resolves to '<resolved-ext-name>.gemspec' (red-candle: candle.gemspec). prepare asserts the resolved file exists. indradb-ruby must set this explicitly (indradb-ruby.gemspec)."
        type: string
        required: false
        default: ""
      version-command:
        description: "Shell command (run at repo root in prepare) printing the bare version to stdout; prepare guards the v-stripped tag equals it. Default is red-candle's; EVERY other consumer MUST override (e.g. `ruby -r./lib/parsekit/version -e 'print Parsekit::VERSION'`)."
        type: string
        required: false
        default: "ruby -r./lib/candle/version -e 'print Candle::VERSION'"
      ruby-versions:
        description: "Comma-separated Ruby ABI set compiled into every fat gem. SINGLE SOURCE OF TRUTH: prepare derives the CSV (cross-gem), a JSON array (darwin matrix), and a space-list (darwin verify loop) from this one value. Default is the stable, broadly-supported set 3.1-3.4. Ruby 4.0 is NOT in the default: its C API changed (e.g. rb_sys::RTypedData.typed_flag) and a gem must be on a 4.0-capable magnus/rb_sys to compile against it; add '4.0' explicitly once the gem's native deps support it (red-candle does)."
        type: string
        required: false
        default: "3.1,3.2,3.3,3.4"
      compile-command:
        description: "Native macOS compile entrypoint on darwin-build (one .bundle per ABI), the rake-compiler/rb_sys common case. The linux legs do NOT use this (oxidize-rb cross-gem owns the linux build)."
        type: string
        required: false
        default: "bundle exec rake compile"
      platform-gem-env:
        description: "Env var name the consumer's gemspec reads to enter its precompiled-platform branch. darwin-package sets ENV[<this>]=<darwin-platform> before `gem build`. red-candle MUST override to RED_CANDLE_PLATFORM_GEM; new adopters use the generic default RUST_GEM_PLATFORM."
        type: string
        required: false
        default: "RUST_GEM_PLATFORM"
      darwin-platform:
        description: "Darwin platform string for the fat gem and its push/attach/verify globs. NEVER intel darwin; publish the GENERIC arm64-darwin (RubyGems does not fall back across darwin majors)."
        type: string
        required: false
        default: "arm64-darwin"
      x86_64-cargo-config:
        description: "OPTIONAL raw .cargo/config.toml text written at repo root on the x86_64-linux leg ONLY, BEFORE cross-gem runs. Empty default => no-op. red-candle sets the aws-lc-sys gcc-95189 workaround. The x86_64-ONLY scoping is HARDCODED. When ALSO setting linux-cargo-config, this per-leg value OVERWRITES (does not merge with) the base on the x86_64 leg."
        type: string
        required: false
        default: ""
      linux-cargo-config:
        description: "OPTIONAL raw .cargo/config.toml text written at repo root on BOTH linux legs (x86_64 AND aarch64), BEFORE cross-gem runs. Empty default => no-op (preserves existing behavior; red-candle leaves it empty). Use for [env] that BOTH legs need (e.g. a uniform BINDGEN_EXTRA_CLANG_ARGS, jobserver/threading flags, or a PROTOC/CC override pointing at a binary the rb-sys-dock image ALREADY ships). The per-leg x86_64-cargo-config / aarch64-cargo-config, when non-empty, OVERWRITE this base on their own leg (last-writer-wins, not a TOML merge — keep all keys for a leg in one input). NOTE: cargo only honors a config.toml [env] whose referenced tools EXIST in the cross container; this input cannot apt-install packages (cross-gem@v1.4.4 exposes no in-container hook)."
        type: string
        required: false
        default: ""
      aarch64-cargo-config:
        description: "OPTIONAL raw .cargo/config.toml text written at repo root on the aarch64-linux leg ONLY, BEFORE cross-gem runs (mirror of x86_64-cargo-config for the cross leg). Empty default => no-op. Use for aarch64-cross [env] like CC/CXX/BINDGEN_EXTRA_CLANG_ARGS for a bindgen/C++ consumer (e.g. RocksDB). The rb-sys aarch64 image ALREADY sets LIBCLANG_PATH + BINDGEN_EXTRA_CLANG_ARGS_aarch64_unknown_linux_gnu=--sysroot=... + the cross toolchain, so this is for AUGMENTING that, not bootstrapping it. OVERWRITES linux-cargo-config on the aarch64 leg when both are set. Cannot install packages absent from the image."
        type: string
        required: false
        default: ""
      darwin-pre-build-command:
        description: "OPTIONAL shell run on EACH darwin-build leg BEFORE compile-command (e.g. `brew install protobuf` for a prost/protoc consumer, or extra C-lib deps for a bundled-C gem). Empty default => skip (correct for red-candle and every plain gem). macos-26 ships Homebrew, so this is the supported darwin escape hatch for a native system build dep. The LINUX legs have NO equivalent hook: cross-gem@v1.4.4 runs the build inside a fixed rb-sys-dock image with no in-container apt step, so a linux system package that the image lacks (protoc, gfortran, leptonica/tesseract dev) cannot be installed here — toggle that leg off OR add it via linux-image-setup (inline-built into the cross image)."
        type: string
        required: false
        default: ""
      linux-image-setup:
        description: "OPTIONAL shell snippet run as a single `RUN` inside an inline-built rb-sys cross image, before each enabled linux leg (the LINUX analogue of darwin-pre-build-command). Empty default => NO-OP (every existing caller is byte-identical). When set, the leg builds `FROM rbsys/<platform>:<linux-rbsys-tag>` + `RUN <this>`, re-tagged to that SAME name, so cross-gem's rb-sys-dock (which only pulls the image when `docker images -q` finds it absent) builds against OUR enriched image. Self-contained — no registry, no auth. More general than apt: use it to apt-install ('apt-get update && apt-get install -y gfortran libopenblas-dev liblapack-dev'), download a build tool ('curl -fsSL .../protoc-*-linux-x86_64.zip -o /tmp/p.zip && unzip -o /tmp/p.zip -d /usr/local'), or stage arm64 multiarch libs ('dpkg --add-architecture arm64 && ... && apt-get install -y libopenblas-dev:arm64'). Newlines are collapsed to spaces, so write a single &&-joined pipeline (a YAML block scalar is fine). NOTE: the cross image is amd64; a host build-TOOL (protoc) serves both target legs, but a TARGET link library for the aarch64 leg needs its arm64 multiarch variant."
        type: string
        required: false
        default: ""
      linux-rbsys-tag:
        description: "The rb_sys version :tag the inline-built cross image is tagged as (rbsys/<platform>:<this>) — MUST equal the rb_sys gem version each consumer gem resolves (the name rb-sys-dock derives and looks up locally). Default 0.9.128 = current crates.io rb-sys max_stable; pin each gem's Cargo.lock to match. Only consulted when linux-image-setup is non-empty."
        type: string
        required: false
        default: "0.9.128"
      job-timeout-minutes:
        description: "OPTIONAL per-job timeout (minutes) for the heavy build legs (linux-gems, darwin-build, darwin-package). Default 360 = GitHub's own default, so existing behavior is unchanged. Raise it for a heavy-C++ consumer (RocksDB, MuPDF/Tesseract, from-source OpenBLAS) whose per-ABI compile can approach the limit; lower it to fail a hung build faster. Source-gem and prepare/collect are light and deliberately not gated."
        type: number
        required: false
        default: 360
      darwin-verify-cmd:
        description: "OPTIONAL extra shell run on each darwin-build leg AFTER compile+relocate, with $BUNDLE exported as the relocated bundle. Empty default => skip. The arm64 file-check ALWAYS runs and stays HARDCODED; only this framework grep is gem-specific."
        type: string
        required: false
        default: ""
      publish:
        description: "INTENT gate for `gem push` (lives in inputs so it is legal in `if:`/bash). DEFAULT FALSE: a tag still builds all gems, runs `gem build`, and creates/attaches the GitHub Release, but skips RubyGems push. Set true AND supply the secret to actually publish. A caller threads this from its own `workflow_dispatch` boolean (default false) to drive a full-matrix DRY-RUN: on a version-less dispatch run every leg builds but the GitHub Release + every attach step are skipped (gated on prepare's is-release output, which is false for a version-less dispatch), so a dry-run never touches RubyGems OR a Release. Orthogonal to the `version` input: providing `version` cuts the tag/Release regardless, while publish still gates the RubyGems push."
        type: boolean
        required: false
        default: false
      version:
        description: "OPTIONAL target version for a workflow_dispatch publish — the 'type a version in a box' path. When NON-EMPTY on a workflow_dispatch run, prepare writes it into the gem's version file via `bump-command`, commits ('Release <v>'), creates+pushes the bare tag <v>, and releases THAT version in the SAME run: every build leg checks out the bumped commit, the GitHub Release is created, and the RubyGems push still obeys the `publish` triad. The commit+tag are pushed with the run's own GITHUB_TOKEN, whose events GitHub does NOT use to trigger further workflows, so the new tag never re-fires the caller's on:push:tags release (no double release; no PAT needed). IGNORED on a `push` event (the tag IS the version) and when empty (the existing version-less dispatch dry-run stays byte-identical). REQUIRES `bump-command`. Must be a valid Gem::Version. CAVEATS: (1) This MUTATES the repo — it pushes a commit, a tag, and creates a GitHub Release even when publish:false (only the RubyGems push is gated by publish, exactly like a publish:false tag push). For a side-effect-free dry-run, use a VERSION-LESS dispatch instead. (2) The no-double-release guarantee relies on the run using the default GITHUB_TOKEN; if the caller drives the release with a PAT / GitHub App token, the pushed tag WOULD re-trigger on:push:tags. (3) The commit+tag are cut BEFORE the build legs run, so if a build leg fails the version is tagged but only partially shipped — re-dispatch the SAME version to complete it (the bump is a no-op when already at that version, and every push is idempotent-on-repush). (4) Needs the job able to push to the branch: contents: write (already required) AND the branch not blocked by branch protection."
        type: string
        required: false
        default: ""
      bump-command:
        description: "Shell command that writes the `version` input into the gem's version file; the target version is exported as $VERSION. REQUIRED only to use the `version` dispatch input (otherwise unused/no-op). After it runs, prepare asserts `version-command` prints exactly $VERSION (catches a wrong file/constant/quoting). Example: sed -i \"s/^\\\\( *VERSION *= *\\\\).*/\\\\1\\\\\"$VERSION\\\\\"/\" lib/topical/version.rb. Mirrors version-command's split: the gem-specific write lives in the caller, the workflow stays generic."
        type: string
        required: false
        default: ""
      build-darwin:
        description: "Toggle the native arm64-darwin legs (darwin-build + darwin-package) together via job-level `if:`. Off => a token-less or Linux-only gem still ships source + 2 linux platforms."
        type: boolean
        required: false
        default: true
      build-x86_64-linux:
        description: "Toggle the x86_64-linux precompiled leg (per-step guard inside the linux-gems matrix). Off => amd64 users fall through to the source gem."
        type: boolean
        required: false
        default: true
      build-aarch64-linux:
        description: "Toggle the aarch64-linux (cross-compiled on the x86_64 ubuntu-24.04 host) precompiled leg. Off => arm64-linux users fall through to the source gem. The cross-on-x86_64 topology stays HARDCODED."
        type: boolean
        required: false
        default: true
    secrets:
      rubygems-api-key:
        description: "RubyGems API key, mapped by every push step into GEM_HOST_API_KEY. required:false is load-bearing: an omitted secret resolves to '' and the in-step `[ -z ]` guard treats it as skip. NEVER referenced in any `if:`. The GitHub Release path uses github.token, not this key."
        required: false
    outputs:
      version:
        description: "Resolved gem version (pushed tag, leading 'v' stripped)."
        value: ${{ jobs.prepare.outputs.version }}
      prerelease:
        description: "'true' if Gem::Version#prerelease? (drives the Release --prerelease flag)."
        value: ${{ jobs.prepare.outputs.prerelease }}
      ext-name:
        description: "The resolved extension/lib-dir name (empty input resolved to gem-name)."
        value: ${{ jobs.prepare.outputs.ext-name }}
      gemspec:
        description: "The resolved gemspec filename actually built."
        value: ${{ jobs.prepare.outputs.gemspec }}
      release-url:
        description: "URL of the GitHub Release created/updated. Empty on a workflow_dispatch dry-run (the Release step is push-only)."
        value: ${{ jobs.source-gem.outputs.release-url }}
      published:
        description: "'true' only if the source gem was actually pushed to RubyGems (publish=true AND token present AND not an idempotent repush-skip)."
        value: ${{ jobs.source-gem.outputs.published }}
      platforms-built:
        description: "Comma-list of platform gems that built green (source,x86_64-linux,aarch64-linux,arm64-darwin)."
        value: ${{ jobs.collect.outputs.platforms }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Guard + single-source-of-truth setup. Resolves empty ext-name/gemspec off
  # gem-name (workflow_call inputs cannot self-reference), asserts the gemspec
  # exists, guards the tag == version-command output, computes prerelease?, and
  # derives the three ruby-version forms (CSV / JSON array / space-list) once.
  # ---------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-24.04
    # contents: write so the OPTIONAL bump-on-dispatch step can commit + push the
    # version bump and tag. A push event / version-less dispatch never writes, so
    # this is unused on those paths. (A reusable workflow can only REDUCE the
    # caller's grant; callers already grant contents: write — see prereq #3.)
    permissions:
      contents: write
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      ext-name: ${{ steps.resolve.outputs.ext-name }}
      gemspec: ${{ steps.resolve.outputs.gemspec }}
      ruby-json: ${{ steps.rubies.outputs.json }}
      ruby-list: ${{ steps.rubies.outputs.list }}
      # The commit SHA every build leg checks out (the bumped commit on a
      # dispatch+version run; else github.sha — byte-identical to the default).
      sha: ${{ steps.v.outputs.sha }}
      # 'true' when this run should create/attach a GitHub Release (a tag push OR
      # a dispatch+version cut); 'false' for a version-less dispatch dry-run.
      is-release: ${{ steps.v.outputs.is-release }}
      # The tag/ref name the Release is created under (pushed tag, or the bumped
      # bare version); empty on a dry-run.
      ref-name: ${{ steps.v.outputs.ref-name }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Resolve ext-name and gemspec (empty -> derived from gem-name)
        id: resolve
        env:
          GEM_NAME: ${{ inputs.gem-name }}
          EXT_NAME: ${{ inputs.ext-name }}
          GEMSPEC: ${{ inputs.gemspec }}
        run: |
          ext="${EXT_NAME:-$GEM_NAME}"
          gemspec="${GEMSPEC:-${ext}.gemspec}"
          if [ ! -f "$gemspec" ]; then
            echo "::error::resolved gemspec '$gemspec' not found. Add an explicit gemspec: input (e.g. gemspec: ${GEM_NAME}.gemspec) — gem-name, ext-name and the gemspec basename can all differ (red-candle: gem-name=red-candle, ext-name=candle, gemspec=candle.gemspec)."
            exit 1
          fi
          echo "ext-name=$ext" >> "$GITHUB_OUTPUT"
          echo "gemspec=$gemspec" >> "$GITHUB_OUTPUT"
          echo "Resolved ext-name=$ext gemspec=$gemspec"
      # ---------------------------------------------------------------------
      # OPTIONAL bump-on-dispatch ("type a version in a box"). On a
      # workflow_dispatch run with a non-empty `version` input, write that
      # version into the gem's version file (via bump-command), commit, create
      # the bare tag <version>, and push BOTH to the branch — all in THIS run.
      # Downstream build jobs check out steps.v.outputs.sha (== this commit), so
      # they build the bumped version. The push uses the run's GITHUB_TOKEN,
      # whose events GitHub does NOT use to trigger further workflows, so the new
      # tag never re-fires the caller's on:push:tags release (no double release,
      # no PAT). NO-OP on a push event or empty `version` (did_bump unset ->
      # step v takes the byte-identical legacy path).
      # ---------------------------------------------------------------------
      - name: Bump + commit + tag version (workflow_dispatch + version input)
        id: bump
        if: ${{ github.event_name != 'push' && inputs.version != '' }}
        env:
          VERSION: ${{ inputs.version }}
          BUMP_COMMAND: ${{ inputs.bump-command }}
          VERSION_COMMAND: ${{ inputs.version-command }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "$BUMP_COMMAND" ]; then
            echo "::error::a 'version' input was given but 'bump-command' is empty — the workflow needs bump-command to know how to write the version into this gem's version file. See the input docs."
            exit 1
          fi
          # Reject anything Gem::Version itself rejects (e.g. 'v1.2', '1.2.x').
          ruby -rrubygems -e 'Gem::Version.new(ARGV[0])' "$VERSION" \
            || { echo "::error::version '$VERSION' is not a valid Gem::Version"; exit 1; }
          echo "Writing version $VERSION via bump-command:"
          echo "  $BUMP_COMMAND"
          eval "$BUMP_COMMAND" \
            || { echo "::error::bump-command failed (exit $?); check the command and its quoting"; exit 1; }
          # The write MUST be reflected by version-command, or the build legs
          # (which resolve the version via version-command) would disagree with
          # the tag we are about to cut.
          NEW_VER="$(eval "$VERSION_COMMAND")"
          if [ "$NEW_VER" != "$VERSION" ]; then
            echo "::error::after bump-command, version-command prints '$NEW_VER' but expected '$VERSION' — bump-command likely edited the wrong file/constant."
            exit 1
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::version file already at $VERSION; no commit needed."
          else
            git commit -m "Release $VERSION"
            git push origin "HEAD:${BRANCH}"
          fi
          # Lightweight BARE tag (matches the org's existing `git tag X.Y.Z`
          # convention). Idempotent on re-dispatch: probe the REMOTE, not the local
          # tag db — a depth-1 checkout fetches NO tags, so a local check would be
          # blind and the subsequent push would be rejected (and abort under set -e).
          # ls-remote --exit-code is 0 when the ref exists on origin, 2 when not.
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "::notice::tag ${VERSION} already on origin; leaving it (re-dispatch / recovery run)."
          else
            git tag "$VERSION"
            git push origin "$VERSION"
          fi
          echo "did_bump=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Bumped + tagged $VERSION at $(git rev-parse HEAD)"
      # On a TAG push this guards GITHUB_REF_NAME (v-stripped) == version-command and
      # is byte-identical to 0.2.0. On a workflow_dispatch DRY-RUN off a branch,
      # GITHUB_REF_NAME is the BRANCH (not a version), so we SKIP the guard and take
      # `version` straight from version-command (the gem's real version) — that real
      # value is what downstream jobs (darwin-package fat-gem verify, collect) need to
      # build with. prerelease? is computed from the resolved version either way.
      - name: Resolve version + prerelease (tag guard on push; version-command on dispatch)
        id: v
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERSION_COMMAND: ${{ inputs.version-command }}
          GEM_NAME: ${{ inputs.gem-name }}
          DID_BUMP: ${{ steps.bump.outputs.did_bump }}
          BUMP_SHA: ${{ steps.bump.outputs.sha }}
          GH_SHA: ${{ github.sha }}
        run: |
          FILE_VER="$(eval "$VERSION_COMMAND")" \
            || { echo "::error::version-command failed to run; check the override quoting (got: $VERSION_COMMAND)"; exit 1; }
          if [ "$EVENT_NAME" = "push" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$FILE_VER" ]; then
              echo "::error::tag '$TAG' != version-command output ('$FILE_VER'). Bump the version before tagging."
              exit 1
            fi
            VERSION="$TAG"
            # Real release off a pushed tag: create the Release at the pushed ref,
            # build legs check out the tagged commit (github.sha) — unchanged.
            IS_RELEASE=true
            REF_NAME="$GITHUB_REF_NAME"
            SHA="$GH_SHA"
          elif [ "$DID_BUMP" = "true" ]; then
            # workflow_dispatch + version: the bump step already wrote/committed/
            # tagged this version. Treat it as a real release: create the Release
            # at the bare tag, and point every build leg at the bumped commit.
            VERSION="$FILE_VER"
            IS_RELEASE=true
            REF_NAME="$VERSION"
            SHA="$BUMP_SHA"
            echo "::notice::${EVENT_NAME} run — releasing bumped version ${VERSION} (tag ${VERSION} cut this run; RubyGems push still gated on publish:true)."
          else
            # workflow_dispatch with no version: ephemeral DRY-RUN off the branch.
            # GITHUB_REF_NAME is the branch, so no tag guard, no Release. Unchanged.
            VERSION="$FILE_VER"
            IS_RELEASE=false
            REF_NAME=""
            SHA="$GH_SHA"
            echo "::notice::${EVENT_NAME} run — DRY-RUN: building version ${VERSION} from version-command (no tag guard, no Release, no RubyGems push unless publish:true). Supply the `version` input to cut + publish a release."
          fi
          PRE="$(ruby -rrubygems -e 'print Gem::Version.new(ARGV[0]).prerelease?' "$VERSION")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "is-release=$IS_RELEASE" >> "$GITHUB_OUTPUT"
          echo "ref-name=$REF_NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Releasing ${GEM_NAME} $VERSION (prerelease=$PRE, event=${EVENT_NAME}, is-release=$IS_RELEASE, ref=${REF_NAME:-<none>}, sha=$SHA)"
      - name: Derive Ruby-version forms (JSON array + space-list) from the CSV
        id: rubies
        env:
          RUBY_VERSIONS: ${{ inputs.ruby-versions }}
        run: |
          JSON="$(ruby -rjson -e 'print ARGV[0].split(",").map(&:strip).to_json' "$RUBY_VERSIONS")"
          LIST="$(ruby -e 'print ARGV[0].split(",").map(&:strip).join(" ")' "$RUBY_VERSIONS")"
          echo "json=$JSON" >> "$GITHUB_OUTPUT"
          echo "list=$LIST" >> "$GITHUB_OUTPUT"
          echo "ruby-json=$JSON ruby-list=$LIST"

  # ---------------------------------------------------------------------------
  # Source gem (platform "ruby"). Pushed first and creates the GitHub Release, so
  # a tag always yields at least an installable gem even if a native leg flakes.
  # MANDATORY — no toggle. Release creation uses github.token, never the rubygems key,
  # and is gated on prepare's is-release (a tag push OR a dispatch+version cut; a
  # version-less dispatch dry-run still BUILDS the source gem — validating `gem build`
  # — but creates no Release).
  # ---------------------------------------------------------------------------
  source-gem:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release-url: ${{ steps.release.outputs.release-url }}
      published: ${{ steps.push.outputs.published }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.prepare.outputs.sha }}   # bumped commit on dispatch+version; else github.sha (unchanged)
      - uses: ruby/setup-ruby@89f90524b88a01fe6e0b732220432cc6142926af # v1.313.0
        with:
          ruby-version: "3.4"
      - name: Build source gem
        run: gem build "${{ needs.prepare.outputs.gemspec }}"
      - name: Push source gem (idempotent; skip if publish off or no token)
        id: push
        env:
          GEM_HOST_API_KEY: ${{ secrets.rubygems-api-key }}
          PUBLISH: ${{ inputs.publish }}
          GEM_NAME: ${{ inputs.gem-name }}
        run: |
          # Default the output on EVERY path so a caller branching on
          # `published == 'false'` (e.g. a "dry-run completed" notification)
          # works on the skip paths, not just the real-push path. Only an
          # actual `gem push` flips it to true below.
          echo "published=false" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISH" != "true" ]; then
            echo "::notice::publish=false (default); built + attached to Release but NOT pushed to RubyGems. Set publish:true to publish."
            exit 0
          fi
          if [ -z "${GEM_HOST_API_KEY:-}" ]; then
            echo "::warning::publish=true but no rubygems-api-key supplied; skipping push"
            exit 0
          fi
          shopt -s nullglob
          pushed=false
          for gem in ${GEM_NAME}-*.gem; do
            echo "==> $gem"
            if ! out=$(gem push "$gem" 2>&1); then
              echo "$out"
              echo "$out" | grep -q "Repushing of gem versions is not allowed" \
                && { echo "already published, skipping"; continue; }
              exit 1
            fi
            pushed=true
          done
          echo "published=$pushed" >> "$GITHUB_OUTPUT"
      # RELEASE-ONLY (is-release). On a tag push REF_NAME is the pushed tag; on a
      # dispatch+version cut REF_NAME is the bare version whose tag the bump step
      # already pushed; on a version-less dispatch dry-run is-release is false, so
      # this is skipped — no junk Release named after the branch — and release-url
      # resolves empty (documented). Either way the tag REF_NAME already exists, so
      # `gh release create` attaches to it.
      - name: Create GitHub Release
        id: release
        if: needs.prepare.outputs.is-release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GEM_NAME: ${{ inputs.gem-name }}
          REF_NAME: ${{ needs.prepare.outputs.ref-name }}
        run: |
          PRERELEASE_FLAG=""
          [ "${{ needs.prepare.outputs.prerelease }}" = "true" ] && PRERELEASE_FLAG="--prerelease"
          if gh release view "$REF_NAME" >/dev/null 2>&1; then
            gh release upload "$REF_NAME" ${GEM_NAME}-*.gem --clobber
          else
            gh release create "$REF_NAME" \
              --title "v${{ needs.prepare.outputs.version }}" \
              $PRERELEASE_FLAG --generate-notes ${GEM_NAME}-*.gem
          fi
          URL="$(gh release view "$REF_NAME" --json url --jq .url)"
          echo "release-url=$URL" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Linux precompiled gems via oxidize-rb cross-gem. BOTH legs run on the x86_64
  # ubuntu-24.04 host — aarch64 is CROSS-compiled (cross toolchain, not QEMU): a
  # native arm runner trips the pinned cross-gem v1.4.4's cargo-binstall
  # host-triple lookup (KeyError aarch64-unknown-linux-musl). Each leg's
  # build/push/attach steps no-op when its toggle input is false. fail-fast:false.
  # ---------------------------------------------------------------------------
  linux-gems:
    needs: [prepare, source-gem]
    if: ${{ !cancelled() && needs.source-gem.result == 'success' && (inputs.build-x86_64-linux || inputs.build-aarch64-linux) }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64-linux
            runs-on: ubuntu-24.04
          - platform: aarch64-linux
            # Cross-compiled on x86_64 (cross toolchain, not QEMU). The native
            # ubuntu-24.04-arm host trips the pinned cross-gem's cargo-binstall
            # host-triple lookup (KeyError aarch64-unknown-linux-musl).
            runs-on: ubuntu-24.04
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: ${{ inputs.job-timeout-minutes }}
    steps:
      - name: Decide whether this leg is enabled
        id: leg
        env:
          PLATFORM: ${{ matrix.platform }}
          BUILD_X86_64: ${{ inputs.build-x86_64-linux }}
          BUILD_AARCH64: ${{ inputs.build-aarch64-linux }}
        run: |
          enabled=false
          if [ "$PLATFORM" = "x86_64-linux" ]  && [ "$BUILD_X86_64"  = "true" ]; then enabled=true; fi
          if [ "$PLATFORM" = "aarch64-linux" ] && [ "$BUILD_AARCH64" = "true" ]; then enabled=true; fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          [ "$enabled" = "true" ] && echo "==> building $PLATFORM" || echo "==> $PLATFORM toggled off; skipping"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        if: steps.leg.outputs.enabled == 'true'
        with:
          ref: ${{ needs.prepare.outputs.sha }}   # bumped commit on dispatch+version; else github.sha (unchanged)
      - uses: ruby/setup-ruby@89f90524b88a01fe6e0b732220432cc6142926af # v1.313.0
        if: steps.leg.outputs.enabled == 'true'
        with:
          ruby-version: "3.4"
      # OPTIONAL cargo config written to .cargo/config.toml at the repo root BEFORE
      # cross-gem runs. cross-gem@v1.4.4 has no env input but bind-mounts the repo,
      # so cargo inside the container reads this [env]. Layering (last-writer-wins,
      # NOT a TOML merge — two [env] tables in one file is invalid):
      #   1. linux-cargo-config  -> base, written on BOTH legs.
      #   2. x86_64-cargo-config -> x86_64 leg only, OVERWRITES the base there.
      #   3. aarch64-cargo-config-> aarch64 leg only, OVERWRITES the base there.
      # For red-candle (only x86_64-cargo-config set): the x86_64 leg writes EXACTLY
      # that text and the aarch64 leg writes nothing — byte-identical to before. The
      # x86_64-only scoping of the aws-lc-sys gcc-95189 workaround is thus preserved.
      # This input cannot apt-install: it only helps when the [env] points at tools
      # the rb-sys-dock image already ships (clang/llvm/cmake/cross-sysroot — yes;
      # protoc/gfortran — no).
      - name: Write cargo config (base + per-leg override, when any input non-empty)
        if: ${{ steps.leg.outputs.enabled == 'true' && (inputs.linux-cargo-config != '' || inputs.x86_64-cargo-config != '' || inputs.aarch64-cargo-config != '') }}
        env:
          PLATFORM: ${{ matrix.platform }}
          LINUX_CARGO_CONFIG: ${{ inputs.linux-cargo-config }}
          X86_64_CARGO_CONFIG: ${{ inputs.x86_64-cargo-config }}
          AARCH64_CARGO_CONFIG: ${{ inputs.aarch64-cargo-config }}
        run: |
          # Pick the per-leg override; fall back to the base. The empty-string
          # default means an unset per-leg input leaves the base in place.
          CONFIG="$LINUX_CARGO_CONFIG"
          if [ "$PLATFORM" = "x86_64-linux" ]  && [ -n "$X86_64_CARGO_CONFIG"  ]; then CONFIG="$X86_64_CARGO_CONFIG";  fi
          if [ "$PLATFORM" = "aarch64-linux" ] && [ -n "$AARCH64_CARGO_CONFIG" ]; then CONFIG="$AARCH64_CARGO_CONFIG"; fi
          if [ -z "$CONFIG" ]; then
            echo "No cargo config applies to $PLATFORM (base empty, no per-leg override); skipping write."
            exit 0
          fi
          mkdir -p .cargo
          printf '%s' "$CONFIG" > .cargo/config.toml
          echo "Wrote .cargo/config.toml for $PLATFORM:"
          cat .cargo/config.toml
      # rb-sys-dock (inside cross-gem) bind-mounts ~/.cargo/registry and ~/.cargo/git
      # into the build container. On a runner where no cargo command has populated
      # them yet (e.g. a gem with no committed Gemfile.lock, so cross-gem's own setup
      # skips creating them), the bind source path is missing and `docker run` aborts
      # with exit 125 (`bind source path does not exist: /home/runner/.cargo/registry`).
      # Pre-create the dirs so the mount always has a valid (possibly empty) source.
      - name: Ensure cargo cache dirs exist (rb-sys-dock bind-mount source)
        if: steps.leg.outputs.enabled == 'true'
        run: mkdir -p ~/.cargo/registry ~/.cargo/git
      # OPTIONAL pre-seed of a DEPS-ENRICHED rb-sys cross image. cross-gem@v1.4.4
      # runs `rb-sys-dock --platform <p> --build`, which computes the image name
      # rbsys/<platform>:<rb_sys version> and only pulls it when `docker images -q`
      # finds it absent. So we build an enriched image INLINE here, FROM that exact
      # stock image + the extra apt packages, tagged to that SAME name — rb-sys-dock
      # then finds it locally, SKIPS its pull, and builds against the image that
      # carries the extra system deps (protoc / OpenBLAS / leptonica-tesseract).
      # Self-contained: no registry, no auth, no separate image-build workflow. The
      # :<tag> MUST equal the rb_sys version this gem resolves (pin its Cargo.lock),
      # else rb-sys-dock derives a different name and this is bypassed. NO-OP when
      # linux-image-setup is empty, so every existing caller is byte-identical. This is
      # the linux analogue of darwin-pre-build-command.
      - name: Build deps-enriched rb-sys cross image (when linux-image-setup set)
        if: ${{ steps.leg.outputs.enabled == 'true' && inputs.linux-image-setup != '' }}
        env:
          PLATFORM: ${{ matrix.platform }}
          IMAGE_TAG: ${{ inputs.linux-rbsys-tag }}
          IMAGE_SETUP: ${{ inputs.linux-image-setup }}
        run: |
          set -euo pipefail
          img="rbsys/${PLATFORM}:${IMAGE_TAG}"
          # Collapse newlines so a multi-line YAML scalar becomes one RUN line
          # (callers join steps with && / ;). Then build FROM the stock image + RUN.
          setup="$(printf '%s' "$IMAGE_SETUP" | tr '\n' ' ')"
          echo "==> building enriched $img (FROM $img)"
          { printf 'FROM %s\n' "$img"; printf 'RUN %s\n' "$setup"; } > /tmp/Dockerfile.cross
          cat /tmp/Dockerfile.cross
          docker build -t "$img" - < /tmp/Dockerfile.cross
          docker images "rbsys/${PLATFORM}"
      - uses: oxidize-rb/actions/cross-gem@e5f9a49a7812a078584072f6e3f657ad247c8771 # v1.4.4
        if: steps.leg.outputs.enabled == 'true'
        id: cross-gem
        with:
          platform: ${{ matrix.platform }}
          ruby-versions: ${{ inputs.ruby-versions }}
      - name: Push ${{ matrix.platform }} gem (idempotent; skip if publish off or no token)
        if: steps.leg.outputs.enabled == 'true'
        env:
          GEM_HOST_API_KEY: ${{ secrets.rubygems-api-key }}
          PUBLISH: ${{ inputs.publish }}
          GEM_PATHS: ${{ steps.cross-gem.outputs.gem-path }}
        run: |
          if [ "$PUBLISH" != "true" ]; then
            echo "::notice::publish=false (default); built ${{ matrix.platform }} gem + attached to Release but NOT pushed to RubyGems. Set publish:true to publish."
            exit 0
          fi
          if [ -z "${GEM_HOST_API_KEY:-}" ]; then
            echo "::warning::publish=true but no rubygems-api-key supplied; skipping push"
            exit 0
          fi
          # Under publish=true, a silent cross-gem failure (empty gem-path) must
          # surface as an error, not a no-op push that looks green.
          if [ -z "${GEM_PATHS// }" ]; then
            echo "::error::cross-gem produced no gem-path for ${{ matrix.platform }}; nothing to push"
            exit 1
          fi
          for gem in $GEM_PATHS; do
            echo "==> $gem"
            if ! out=$(gem push "$gem" 2>&1); then
              echo "$out"
              echo "$out" | grep -q "Repushing of gem versions is not allowed" \
                && { echo "already published, skipping"; continue; }
              exit 1
            fi
          done
      # `|| true` makes a Release-asset upload failure NON-FATAL by design: the
      # gem is already on RubyGems (the source of truth); the Release asset is a
      # convenience mirror, so a transient upload glitch must not fail the run.
      # PUSH-ONLY: on a workflow_dispatch dry-run the gem still BUILDS above (the
      # point — validating cross-gem + fat-gem assembly) but there is no Release to
      # attach to (source-gem skipped Release creation off a branch).
      - name: Attach to GitHub Release
        if: ${{ steps.leg.outputs.enabled == 'true' && needs.prepare.outputs.is-release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ needs.prepare.outputs.ref-name }}
        run: gh release upload "$REF_NAME" ${{ steps.cross-gem.outputs.gem-path }} --clobber || true

  # ---------------------------------------------------------------------------
  # arm64-darwin: built NATIVELY on Apple Silicon (macos-26). The oxidize-rb/rb-sys
  # cross path is Linux/Docker-only and produces a CPU-only darwin binary (frameworks
  # can't link under osxcross). Compile one .bundle per Ruby ABI here, then assemble
  # them in darwin-package. The whole darwin sub-chain skips as a unit when
  # build-darwin is false (job-level `if:`).
  # ---------------------------------------------------------------------------
  darwin-build:
    needs: prepare
    if: ${{ inputs.build-darwin }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ${{ fromJSON(needs.prepare.outputs.ruby-json) }}
    runs-on: macos-26
    timeout-minutes: ${{ inputs.job-timeout-minutes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.prepare.outputs.sha }}   # bumped commit on dispatch+version; else github.sha (unchanged)
      - uses: oxidize-rb/actions/setup-ruby-and-rust@e5f9a49a7812a078584072f6e3f657ad247c8771 # v1.4.4
        with:
          ruby-version: ${{ matrix.ruby }}
          rustup-toolchain: stable
          bundler-cache: true
      # OPTIONAL native system-dep install BEFORE compile (darwin only). macos-26
      # ships Homebrew, so a prost/protoc or bundled-C consumer can `brew install`
      # here. Empty default => skip (red-candle and every plain gem). The linux legs
      # have no analogue — the rb-sys-dock image is fixed and cross-gem@v1.4.4 has
      # no in-container install step.
      - name: Darwin pre-build system deps (when input non-empty)
        if: ${{ inputs.darwin-pre-build-command != '' }}
        env:
          DARWIN_PRE_BUILD_COMMAND: ${{ inputs.darwin-pre-build-command }}
        run: |
          echo "Running darwin-pre-build-command before compile:"
          echo "  $DARWIN_PRE_BUILD_COMMAND"
          eval "$DARWIN_PRE_BUILD_COMMAND" \
            || { echo "::error::darwin-pre-build-command failed (exit $?). Check the command and its quoting."; exit 1; }
      # Per-ABI Cargo cache so a darwin leg does not recompile the entire Rust
      # dependency tree cold on every run (the dominant cost here). Mirrors the
      # proven build.yml pattern: registry/git index + the rb-sys build tmp
      # (rake-compiler/rb_sys drop the native target dirs under tmp/). Keyed per
      # matrix Ruby ABI so ABIs do not clobber each other's compiled artifacts,
      # with a prefix restore-key for a partial hit on a Cargo.lock change.
      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tmp
          key: macos-cargo-${{ matrix.ruby }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            macos-cargo-${{ matrix.ruby }}-
      - name: Compile native extension
        run: ${{ inputs.compile-command }}
      - name: Save Cargo cache
        # Only on a miss, and even if a later step fails, so a slow cold compile
        # is not repaid on the next run.
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tmp
          key: macos-cargo-${{ matrix.ruby }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Relocate bundle into Ruby-ABI subdir
        env:
          MINOR: ${{ matrix.ruby }}
          EXT_NAME: ${{ needs.prepare.outputs.ext-name }}
        run: |
          test -f "lib/${EXT_NAME}/${EXT_NAME}.bundle"
          mkdir -p "lib/${EXT_NAME}/${MINOR}"
          mv "lib/${EXT_NAME}/${EXT_NAME}.bundle" "lib/${EXT_NAME}/${MINOR}/${EXT_NAME}.bundle"
      - name: Verify arm64 (hardcoded) + optional framework linkage
        env:
          MINOR: ${{ matrix.ruby }}
          EXT_NAME: ${{ needs.prepare.outputs.ext-name }}
          DARWIN_VERIFY_CMD: ${{ inputs.darwin-verify-cmd }}
        run: |
          export BUNDLE="lib/${EXT_NAME}/${MINOR}/${EXT_NAME}.bundle"
          file "$BUNDLE"
          file "$BUNDLE" | grep -q arm64 \
            || { echo "::error::$BUNDLE is not arm64 — wrong runner?"; exit 1; }
          if [ -n "$DARWIN_VERIFY_CMD" ]; then
            echo "Running darwin-verify-cmd against $BUNDLE"
            eval "$DARWIN_VERIFY_CMD" \
              || { echo "::error::darwin-verify-cmd failed (exit $?). A real linkage regression OR a malformed override — check the command's own error above and its quoting."; exit 1; }
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: darwin-bundle-${{ matrix.ruby }}
          path: lib/${{ needs.prepare.outputs.ext-name }}/${{ matrix.ruby }}/${{ needs.prepare.outputs.ext-name }}.bundle
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Assemble the per-ABI .bundles into ONE arm64-darwin fat gem, push, attach.
  # The gemspec's platform-gem-env branch sets platform=<darwin-platform>, clears
  # spec.extensions (no recompile-on-install), and packs the bundles. We publish
  # the GENERIC darwin platform: RubyGems does not fall back across darwin majors.
  # The !cancelled() + result gate keeps the needs-edge valid when darwin is off.
  # ---------------------------------------------------------------------------
  darwin-package:
    needs: [prepare, source-gem, darwin-build]
    if: ${{ inputs.build-darwin && !cancelled() && needs.source-gem.result == 'success' && (needs.darwin-build.result == 'success' || needs.darwin-build.result == 'skipped') }}
    runs-on: macos-26
    timeout-minutes: ${{ inputs.job-timeout-minutes }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.prepare.outputs.sha }}   # bumped commit on dispatch+version; else github.sha (unchanged)
      - uses: ruby/setup-ruby@89f90524b88a01fe6e0b732220432cc6142926af # v1.313.0
        with:
          ruby-version: "3.4"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: darwin-bundle-*
          path: darwin-bundles
      - name: Reassemble per-ABI bundle layout
        env:
          EXT_NAME: ${{ needs.prepare.outputs.ext-name }}
        run: |
          for d in darwin-bundles/darwin-bundle-*; do
            minor="${d##*darwin-bundle-}"
            mkdir -p "lib/${EXT_NAME}/${minor}"
            mv "${d}/${EXT_NAME}.bundle" "lib/${EXT_NAME}/${minor}/${EXT_NAME}.bundle"
          done
          echo "Assembled ABIs:"; ls -1 lib/${EXT_NAME}/*/${EXT_NAME}.bundle
      - name: Build ${{ inputs.darwin-platform }} fat gem
        env:
          DARWIN_PLATFORM: ${{ inputs.darwin-platform }}
          PLATFORM_GEM_ENV: ${{ inputs.platform-gem-env }}
          GEMSPEC: ${{ needs.prepare.outputs.gemspec }}
        run: |
          export "${PLATFORM_GEM_ENV}=${DARWIN_PLATFORM}"
          gem build "$GEMSPEC"
      - name: Verify fat gem carries every ABI bundle
        env:
          EXT_NAME: ${{ needs.prepare.outputs.ext-name }}
          GEM_NAME: ${{ inputs.gem-name }}
          DARWIN_PLATFORM: ${{ inputs.darwin-platform }}
          RUBY_LIST: ${{ needs.prepare.outputs.ruby-list }}
        run: |
          GEM="$(ls ${GEM_NAME}-*-${DARWIN_PLATFORM}.gem)"
          echo "Inspecting $GEM"
          DATA="$(tar -xOf "$GEM" data.tar.gz | tar -tzf -)"
          echo "$DATA" | grep -E "lib/${EXT_NAME}/[0-9.]+/${EXT_NAME}\.bundle" || true
          for v in $RUBY_LIST; do
            echo "$DATA" | grep -q "lib/${EXT_NAME}/${v}/${EXT_NAME}.bundle" \
              || { echo "::error::fat gem missing ABI ${v}"; exit 1; }
          done
      - name: Push ${{ inputs.darwin-platform }} gem (idempotent; skip if publish off or no token)
        env:
          GEM_HOST_API_KEY: ${{ secrets.rubygems-api-key }}
          PUBLISH: ${{ inputs.publish }}
          GEM_NAME: ${{ inputs.gem-name }}
          DARWIN_PLATFORM: ${{ inputs.darwin-platform }}
        run: |
          if [ "$PUBLISH" != "true" ]; then
            echo "::notice::publish=false (default); built ${DARWIN_PLATFORM} gem + attached to Release but NOT pushed to RubyGems. Set publish:true to publish."
            exit 0
          fi
          if [ -z "${GEM_HOST_API_KEY:-}" ]; then
            echo "::warning::publish=true but no rubygems-api-key supplied; skipping push"
            exit 0
          fi
          shopt -s nullglob
          for gem in ${GEM_NAME}-*-${DARWIN_PLATFORM}.gem; do
            echo "==> $gem"
            if ! out=$(gem push "$gem" 2>&1); then
              echo "$out"
              echo "$out" | grep -q "Repushing of gem versions is not allowed" \
                && { echo "already published, skipping"; continue; }
              exit 1
            fi
          done
      # `|| true` makes a Release-asset upload failure NON-FATAL by design (the
      # gem is already on RubyGems; the Release asset is a convenience mirror).
      # PUSH-ONLY: a workflow_dispatch dry-run still BUILDS + verifies the fat gem
      # above (the point — validating per-ABI assembly) but there is no Release to
      # attach to (source-gem skipped Release creation off a branch).
      - name: Attach to GitHub Release
        if: needs.prepare.outputs.is-release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GEM_NAME: ${{ inputs.gem-name }}
          DARWIN_PLATFORM: ${{ inputs.darwin-platform }}
          REF_NAME: ${{ needs.prepare.outputs.ref-name }}
        run: gh release upload "$REF_NAME" ${GEM_NAME}-*-${DARWIN_PLATFORM}.gem --clobber || true

  # ---------------------------------------------------------------------------
  # OPTIONAL post-join aggregator: composes the platforms-built comma-list from
  # each leg's result. The only GHA-correct place to fan a per-platform list out
  # of matrix jobs (which collapse to one output). Pure reporting; uses result
  # checks (never the all-success default) so a toggled-off leg never fails the run.
  # ---------------------------------------------------------------------------
  collect:
    needs: [prepare, source-gem, linux-gems, darwin-build, darwin-package]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      platforms: ${{ steps.agg.outputs.platforms }}
    steps:
      - name: Aggregate platforms built
        id: agg
        env:
          SOURCE_RESULT: ${{ needs.source-gem.result }}
          LINUX_RESULT: ${{ needs.linux-gems.result }}
          DARWIN_RESULT: ${{ needs.darwin-package.result }}
          BUILD_X86_64: ${{ inputs.build-x86_64-linux }}
          BUILD_AARCH64: ${{ inputs.build-aarch64-linux }}
          DARWIN_PLATFORM: ${{ inputs.darwin-platform }}
        run: |
          parts=""
          add() { if [ -z "$parts" ]; then parts="$1"; else parts="${parts},$1"; fi; }
          [ "$SOURCE_RESULT" = "success" ] && add "source"
          if [ "$LINUX_RESULT" = "success" ]; then
            [ "$BUILD_X86_64"  = "true" ] && add "x86_64-linux"
            [ "$BUILD_AARCH64" = "true" ] && add "aarch64-linux"
          fi
          [ "$DARWIN_RESULT" = "success" ] && add "$DARWIN_PLATFORM"
          echo "platforms=$parts" >> "$GITHUB_OUTPUT"
          echo "platforms-built=$parts"
