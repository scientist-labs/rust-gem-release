# Reusable PR-CI workflow for scientist-labs Rust gems (rb-sys / rake-compiler).
#
# THIS IS A REUSABLE WORKFLOW (on: workflow_call), NOT a composite action. A caller
# wires it to its own pull_request trigger:
#
#   # .github/workflows/build.yml in the consuming gem
#   name: build
#   on: pull_request
#   permissions:
#     contents: read
#   jobs:
#     ci:
#       uses: scientist-labs/rust-gem-release/.github/workflows/build.yml@v0
#       with:
#         ruby-versions: "3.4,4.0"                 # optional; default below
#         test-command: "bundle exec rake spec"    # optional; default below
#
# It does the minimum a Rust-gem PR needs on each Ruby ABI: checkout, set up Ruby
# (with bundler-cache) + Rust, restore/save a Cargo cache keyed on the Ruby patch
# version + Cargo.lock, `bundle exec rake compile`, then run a configurable spec
# command. The heavy multi-platform fat-gem matrix lives in the sibling release.yml.
#
# Third-party AND first-party actions are SHA-pinned (supply-chain), consistent with
# release.yml. Comments show the tag.

on:
  workflow_call:
    inputs:
      ruby-versions:
        description: >-
          Comma-separated Ruby versions to run the PR build against (one matrix
          leg each). PR CI does not need the full release ABI set; default to a
          stable low+high pair so a break on either edge surfaces. Ruby 4.0 is
          intentionally excluded from the default (its C API breaks gems on older
          magnus/rb_sys — rb_sys::RTypedData.typed_flag); add it once the gem's
          native deps support 4.0, matching the gem's release ruby-versions.
        type: string
        required: false
        default: "3.3,3.4"
      runs-on:
        description: >-
          Linux runner label for every matrix leg (e.g. ubuntu-latest,
          ubuntu-24.04). PR CI is Linux-only; the native-darwin path lives in
          release.yml.
        type: string
        required: false
        default: "ubuntu-latest"
      test-command:
        description: >-
          Shell command that runs the test suite after `bundle exec rake compile`.
          Default runs the gem's default rake spec task; override for a gem whose
          suite needs custom invocation or isolation.
        type: string
        required: false
        default: "bundle exec rake spec"
      timeout-minutes:
        description: Per-leg job timeout (minutes). Guards a hung native build/spec.
        type: number
        required: false
        default: 30

# Least privilege: the build job only checks out, caches, compiles, and tests.
permissions:
  contents: read

jobs:
  # GitHub Actions expressions have NO string split/replace function, so a CSV
  # input cannot be turned into a matrix array inline (the old
  # `replace(inputs.ruby-versions, ...)` form fails to compile -> 0s "workflow
  # file issue"). Derive the JSON array in a tiny setup job (system ruby is
  # preinstalled on the runner), exactly as release.yml's prepare job does, and
  # fan the build matrix out of it.
  setup:
    runs-on: ${{ inputs.runs-on }}
    outputs:
      ruby-json: ${{ steps.rubies.outputs.json }}
    steps:
      - name: Derive Ruby-version JSON array from the CSV input
        id: rubies
        env:
          RUBY_VERSIONS: ${{ inputs.ruby-versions }}
        run: |
          JSON="$(ruby -rjson -e 'print ARGV[0].split(",").map(&:strip).to_json' "$RUBY_VERSIONS")"
          echo "json=$JSON" >> "$GITHUB_OUTPUT"
          echo "ruby-json=$JSON"

  build:
    needs: setup
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ${{ fromJSON(needs.setup.outputs.ruby-json) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Sets up BOTH Ruby and Rust (the same action release.yml's darwin-build
      # uses). ruby/setup-ruby alone has no rustup-toolchain input, so it would
      # leave no cargo for `rake compile`; this one installs the toolchain and
      # runs bundle install with caching, so no separate rustup/bundle step.
      - uses: oxidize-rb/actions/setup-ruby-and-rust@e5f9a49a7812a078584072f6e3f657ad247c8771 # v1.4.4
        with:
          ruby-version: ${{ matrix.ruby-version }}
          rustup-toolchain: stable
          bundler-cache: true

      - name: Detect Ruby patch version for cache key
        id: ruby-version
        run: echo "patch=$(ruby -e 'print RUBY_VERSION')" >> "$GITHUB_OUTPUT"

      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # Registry/git index + the whole rb-sys build tmp (target dirs land
          # under tmp/<arch>/<ext>/<ruby>/target). Keyed per Ruby patch so ABIs
          # do not clobber each other's compiled artifacts.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tmp
          key: ${{ runner.os }}-cargo-${{ steps.ruby-version.outputs.patch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ steps.ruby-version.outputs.patch }}-

      - name: Compile native extension
        run: bundle exec rake compile

      - name: Save Cargo cache
        # Only on a miss, and even if the build/tests fail, so a slow cold
        # compile is not repaid on the next run.
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tmp
          key: ${{ runner.os }}-cargo-${{ steps.ruby-version.outputs.patch }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: ${{ inputs.test-command }}
